# The bof3-player repository: the player, its library and the generic
# PlayStation crates it reads through. The workspace builds on its own.
[workspace]
resolver = "3"
members = ["core", "emi", "psx-audio", "psx-cd", "psx-formats", "psx-machine"]
exclude = ["vendor/stacksafe-macro"]

[patch.crates-io]
# gpui requires stacksafe 0.1; its macro uses an unmaintained dependency.
stacksafe-macro = { path = "vendor/stacksafe-macro" }
# gpui 0.2.2 pins taffy 0.9.0, which uses vulnerable grid 0.18.
taffy = { path = "vendor/taffy" }

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/raulcorreia7/bof3-player"
homepage = "https://github.com/raulcorreia7/bof3-player"

[workspace.dependencies]
bof3player = { path = "core", version = "0.1.3", default-features = false }
emi = { path = "emi", version = "0.1.3", default-features = false }
psx-audio = { path = "psx-audio", version = "0.1.3", default-features = false }
psx-cd = { path = "psx-cd", version = "0.1.3" }
psx-formats = { path = "psx-formats", version = "0.1.3", default-features = false }
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
claxon = "0.4.3"
cpal = "0.18.2"
gpui = "=0.2.2"
hound = "3.5.1"
lewton = "0.10.2"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

# The interpreter runs millions of instructions per test; unoptimized it is too slow to boot.
[profile.dev.package.psx-machine]
opt-level = 3

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
