name: CI

# Format, lint, test, minimum Rust version, dependency and release build checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  # Reads the whole pull request's file list; a per-job `git diff HEAD^1` sees only its last commit.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      lock: ${{ steps.files.outputs.lock }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=true
          lock=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.pull_request.number }}/files?per_page=100" --jq '.[].filename') || files=unknown
            code=false
            if printf '%s\n' "$files" | grep -qvE '^(.*\.md|docs/.*|LICENSE[^/]*|NOTICE|\.github/ISSUE_TEMPLATE/.*)$'; then code=true; fi
            if printf '%s\n' "$files" | grep -qE '^\.github/workflows/'; then code=true; fi
            lock=false
            if printf '%s\n' "$files" | grep -qE '(^|/)Cargo\.(lock|toml)$'; then lock=true; fi
          fi
          { echo "code=$code"; echo "lock=$lock"; } >> "$GITHUB_OUTPUT"

  hygiene:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all --check
      # The lock rarely changes; the nightly deny workflow keeps advisories current between changes.
      - if: needs.changes.outputs.lock == 'true' || github.event_name != 'pull_request'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: ''

  no-default-features:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs-only pull requests skip the build steps.
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check without default features
        if: needs.changes.outputs.code == 'true'
        run: cargo check -p psx-formats -p emi -p psx-audio -p bof3player --no-default-features --locked

  check:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        # Windows reports from check-windows; this matrix keeps its own runners warm for code.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs-only pull requests skip the build steps.
      - name: Install Linux dependencies
        if: needs.changes.outputs.code == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Install Rust components
        if: needs.changes.outputs.code == 'true'
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: cargo test --workspace --all-features --locked

  # The ruleset requires this context; a skipped job reports it as skipped, which counts as successful.
  check-windows:
    name: check (windows-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked

  msrv:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs-only pull requests skip the build steps.
      - name: Install Linux dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Install the minimum supported Rust version
        if: needs.changes.outputs.code == 'true'
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: needs.changes.outputs.code == 'true'
        run: cargo check --workspace --all-features --locked

  build-release:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Docs-only pull requests skip the build steps.
      - name: Install Linux GUI/audio dependencies
        if: needs.changes.outputs.code == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - if: needs.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release CLI and TUI
        if: needs.changes.outputs.code == 'true'
        run: make build-cli
      - name: Build release GUI
        if: needs.changes.outputs.code == 'true'
        run: make build-gui
