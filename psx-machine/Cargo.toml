[package]
name = "psx-machine"
description = "A PlayStation machine that runs game code and records what it tells the GPU and the SPU"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["playstation", "psx", "emulator", "r3000", "gpu"]
categories = ["emulators", "game-development"]
include = ["src/**", "tests/**", "README.md", "LICENSE"]
publish = false

[dependencies]
psx-cd = { version = "0.1.3", path = "../psx-cd" }

[dev-dependencies]
emi = { version = "0.1.3", path = "../emi" }
psx-formats = { version = "0.1.3", path = "../psx-formats" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
