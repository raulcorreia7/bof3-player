# cbindgen settings for capi/include/bof3player_capi.h.
# The header is generated by tests/header.rs with the cbindgen version in Cargo.lock.
language = "C"
include_guard = "BOF3PLAYER_CAPI_H"
pragma_once = true
style = "type"
usize_is_size_t = true
cpp_compat = true
documentation = true
sort_by = "Name"
header = "/* bof3player C API. Generated by cbindgen from the Rust declarations; do not edit. */"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[parse]
parse_deps = false
