[package]
name = "emi"
description = "EMI archive container: table of contents, entry extraction and type-8 cue records"
version = "0.1.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["playstation", "archive", "container", "cue"]
categories = ["parser-implementations", "no-std"]
include = ["src/**", "README.md", "LICENSE"]
publish = false

[features]
default = ["std"]
# Table, payload and cue parsing from bytes alone (`no_std + alloc`); `std` adds
# files, folders and entry extraction.
std = ["psx-formats/std", "dep:serde", "dep:serde_json"]

[dependencies]
psx-formats = { version = "0.1.3", path = "../psx-formats", default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
